[project]
name = "scraping-platform"
version = "0.1.0"
description = "Agentic AI web scraping platform. Deterministic by default, LLM assisted when configuration is missing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "httpx[http2]>=0.27.0",
    "selectolax>=0.3.25",
    "structlog>=24.4.0",
    "asgi-correlation-id>=4.3.4",
    "python-json-logger>=2.0.7",
    "orjson>=3.10.0",
    "uuid-utils>=0.9.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "testcontainers[postgres]>=4.8.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "import-linter>=2.1.0",
    "respx>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# ---------------------------------------------------------------------------
# ruff: lint + format (one tool). Config pinned by spec 0001.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["legacy", "migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "RUF",
    "ASYNC",
    "T20",
    "PT",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"migrations/**" = ["N"]
# One-off utility scripts: allow print statements and loose style.
"scripts/**" = ["T20", "SIM108"]

# ---------------------------------------------------------------------------
# mypy: strict project wide. Spec 0001 pin.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["legacy/", "migrations/versions/"]

[[tool.mypy.overrides]]
module = [
    "selectolax.*",
    "testcontainers.*",
    "uuid_utils.*",
    "jsonschema.*",
    "respx.*",
    "charset_normalizer.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: integration tests that hit real services (Postgres via testcontainers)",
]

# ---------------------------------------------------------------------------
# import-linter: module boundary enforcement. Spec 0001 pin.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "Domains must not import each other directly"
type = "independence"
# `app.domains.agents` joins this list when Slice 4 lands its module
# (spec 0001 keeps that folder empty until then).
# `app.domains.extraction` is deliberately out of this contract: spec 0005
# AC-1 types ExtractionService.run on WorkflowVersion and target URL, so
# extraction is a layered reader over workflows + websites rather than an
# independent sibling.
modules = [
    "app.domains.websites",
    "app.domains.workflows",
    "app.domains.executions",
    "app.domains.products",
]

[[tool.importlinter.contracts]]
name = "Extraction only reads workflows + websites, never writes them"
type = "forbidden"
# Extraction imports WorkflowConfig / FieldSpec / CanonicalURL for input,
# but domains the other way around would create a cycle.
source_modules = ["app.domains.workflows", "app.domains.websites"]
forbidden_modules = ["app.domains.extraction"]

[[tool.importlinter.contracts]]
name = "Infrastructure must not import domains"
type = "forbidden"
source_modules = ["app.infrastructure"]
forbidden_modules = ["app.domains"]
