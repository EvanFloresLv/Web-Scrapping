# Pre-commit hooks. Install once with `uv run pre-commit install`.
# Per spec 0001: ruff (lint + format), mypy strict, basic hygiene.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - "pydantic>=2.9.0"
          - "pydantic-settings>=2.6.0"
          - "fastapi>=0.115.0"
          - "sqlalchemy>=2.0.36"
          - "alembic>=1.13.0"
          - "structlog>=24.4.0"
          - "asgi-correlation-id>=4.3.4"
          - "uuid-utils>=0.9.0"
          - "httpx>=0.27.0"
          - "jsonschema>=4.23.0"
        args: ["--config-file=pyproject.toml"]
        files: ^src/

  # Spec 0008 AC-13: run Biome via lint-staged on staged frontend files only.
  # Staging only backend files leaves this hook as a no-op (lint-staged is a
  # noop when nothing matches its glob). Using the Python pre-commit as the
  # single entry point avoids clobbering `.git/hooks` the way Husky would.
  - repo: local
    hooks:
      - id: frontend-lint-staged
        name: frontend lint-staged (Biome)
        language: system
        entry: pnpm --dir frontend lint-staged
        pass_filenames: false
        files: ^frontend/.+\.(ts|tsx|js|jsx|json|css)$
