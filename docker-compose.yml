# Local dev services. Per spec 0001, Postgres runs in Compose; the app runs on
# the host with uv for hot reload. Add Redis later when Slice 8 lands.

services:
  postgres:
    image: postgres:16-alpine
    container_name: scraping_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scraping
      POSTGRES_PASSWORD: scraping
      POSTGRES_DB: scraping
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraping -d scraping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
